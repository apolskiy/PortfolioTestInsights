name: Collect and Publish Insights

# Ingestion is a race against deletion. GitHub keeps Actions artifacts for at
# most 90 days on public repositories - a maximum, not a default, so no setting
# extends it - and anything not collected before then is gone permanently. A
# daily schedule keeps the widest possible margin against that deadline at
# negligible cost, since the job spends no external API quota: it reads the
# Actions API of repositories this account owns and nothing else.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional note recorded in the run log'
        required: false
        default: 'manual collection'

# Writes the durable record and the generated page back to this repository.
permissions:
  contents: write

# Two ingestions writing the same NDJSON partition would interleave, so runs are
# serialized. `cancel-in-progress: false` because a cancelled run has already
# spent its downloads and would leave the record partially written - which is
# recoverable, since appends are idempotent, but pointless.
concurrency:
  group: portfoliotestinsights-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The only step that needs a credential. A fine-grained, read-only PAT:
      # Actions: read and Contents: read over the four source repositories. The
      # built-in GITHUB_TOKEN cannot read another repository's artifacts.
      - name: Ingest New Results
        env:
          PORTFOLIO_READ_TOKEN: ${{ secrets.PORTFOLIO_READ_TOKEN }}
        run: make ingest

      # Index and reports read only data/. No token, no network - which is what
      # lets a fresh clone reproduce every published figure offline.
      - name: Rebuild Index and Render Report
        run: |
          make report
          make site

      # The page is regenerated from the record every time, so a run where
      # nothing new arrived still rewrites an identical file apart from its
      # timestamp. Committing that would fill the history with changes that say
      # nothing. Only a real change to the record or to the report body is
      # worth a commit.
      - name: Commit If Anything Changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data reports docs
          if git diff --cached --quiet -- data reports; then
            echo "No new results and no change to the report body - nothing to commit."
            git reset --quiet
            exit 0
          fi
          git commit -m "Collect test results and regenerate the published report"
          git push

      - name: Summarize
        run: |
          {
            echo '## Collection summary'
            echo
            sed -n '/^## Inventory/,/^## Same-input/p' reports/insights.md | head -n -1
          } >> "$GITHUB_STEP_SUMMARY"
