# Source configuration for the collector.
#
# Every difference between the repositories lives here rather than in code.
# Adding a project is an entry in this file; it is never a new module and never
# a copy of an existing one.
#
# Two optional keys per artifact control volume, and exist because the
# Multi-LLM Evaluation suites produce far more data than the rest combined:
#   steps: all | failures   - `failures` drops a passing or skipped result's
#                             steps and marks it `steps_omitted`.
#   keep: every | latest_per_day - `latest_per_day` reads only the newest
#                             artifact per completed UTC day and parameter set.
# Both default to the first value, so every earlier entry is unchanged.
#
# artifact `name` is matched as a regular expression against the artifact name.
# Named groups become parameter columns, which is how PublicAP's matrix legs
# become data instead of four near-identical config blocks.
#
# `glob` is matched with fnmatch against the paths inside the artifact zip.

# Error-budget policy for the SLO section of the report.
#
# The objective is deliberately **relative** - a multiple of each test's own
# established median - rather than an absolute millisecond figure. No suite in
# this portfolio declares a per-test duration SLA, so an absolute number here
# would be invented rather than measured, and a single figure across tests
# ranging from 1 ms to 30 s would be meaningless anyway.
#
# What this does *not* do is restate CountryWeather's API thresholds (5.0s
# countries, 3.0s weather). Those are per-HTTP-request SLAs enforced inside that
# suite, and this record holds *test* durations - a test issuing several calls
# is not comparable to one of them. Duplicating the number here would produce a
# second gate measuring a different thing under the same name.
slo:
  # Trailing runs considered. Short enough that a regression shows up while it
  # is still recent, long enough that one bad run does not spend the budget.
  window_runs: 20
  # A run breaches when it exceeds this multiple of the test's baseline median.
  tolerance: 3.0
  # Fraction of the window allowed to breach before the budget is spent.
  budget: 0.10
  # Below this many observations in the window, no verdict is published. A
  # budget computed from four runs is arithmetic, not evidence.
  min_observations: 10
  # Tests whose baseline median is below this are excluded outright.
  #
  # Measured, not guessed: the median test in this record has a **1 ms**
  # baseline and 145 of 234 sit under 10 ms. A 3x tolerance on 1 ms means
  # "breached at 3 ms", which is scheduler jitter and timer granularity rather
  # than degradation - the first draft of this section duly reported 51 of 225
  # tests as having spent their budget, almost all of them sub-millisecond unit
  # tests. A relative objective needs an absolute floor beneath which slowness
  # is not a thing anyone experiences.
  floor_ms: 100

sources:
  - repo: apolskiy/PlaywrightAPWebsiteAutomation
    prefix: PAWA
    artifacts:
      # Leading `*` on purpose: the report has been uploaded both under
      # `reports/allure-report/` and at the archive root across this history,
      # and fnmatch's `*` spans `/` and matches the empty string, so one
      # pattern covers both layouts without a second config entry.
      - name: "^execution-reports$"
        parser: allure_report
        glob: "*data/test-cases/*.json"
      - name: "^allure-results-(?P<browser>\\w+)$"
        parser: allure_raw
        glob: "*-result.json"

  - repo: apolskiy/CountryWeather
    prefix: CWA
    artifacts:
      # Same two layouts as PlaywrightAPWebsiteAutomation; see the note above.
      - name: "^qa-artifacts$"
        parser: allure_report
        glob: "*data/test-cases/*.json"

  - repo: apolskiy/VM-Deployment-and-Configuration
    prefix: VMD
    artifacts:
      # This repository has run under two workflow names, `CI` and
      # `VM Cluster CI`, so ingestion keys on artifact name and never on
      # workflow name.
      - name: "^allure-results$"
        parser: allure_raw
        glob: "*-result.json"

  - repo: apolskiy/PublicAP
    prefix: PAP
    artifacts:
      - name: "^emulator-reports-(?P<os>[\\w-]+)-py(?P<python>[\\d.]+)$"
        parser: junit
        glob: "emulator-results.xml"
      # The container suite runs outside `testpaths`, so its results appear in
      # neither the emulator artifacts above nor any other. Six assigned IDs
      # (PAP_10001..PAP_10006) existed for tests this record had never seen,
      # which the legend made visible by starting PublicAP's range at 10007.
      #
      # `image` is captured as a parameter rather than folded into the artifact
      # name because the same tests run against two different images - the one
      # built from the commit, and the one already published. That is a real
      # difference in the system under test, so it is data on the row rather
      # than two config entries.
      - name: "^image-reports-(?P<image>built|published)$"
        parser: junit
        glob: "image-results.xml"

  # The Multi-LLM Evaluation project: a harness and its cases, split into two
  # repositories so each can change without destabilizing the other. Both write
  # the assigned ID into the test function's name and publish no label for it,
  # and both use the MQC prefix, so each carries a pattern and its own code.
  #
  # Sizes measured on one artifact of each kind, 2026-11-10: a harness unit run
  # is 1057 results and 3.0 MB of rows with steps, 1.15 MB without; a model
  # preconditions run 253 results, 0.79 / 0.28 MB; one engine's P0 band 19
  # results, 0.19 / 0.04 MB. Collected in full that was about 1.5 GB against an
  # 18 MB record, and a single month's partition would pass GitHub's 100 MB
  # file limit. Hence, for the gate artifacts: the Ubuntu leg only (the Windows
  # leg replays the same recordings), steps kept on failures only, and the unit
  # tiers - which must be 100% green on main by rule - once per day.
  - repo: apolskiy/AP-Harness-QC
    prefix: MQC
    code: MQC-H
    test_id_from_name: "^(?P<test_id>MQC_[A-Z]+_[A-Z]+_\\d{6})(?:_|$)"
    artifacts:
      # Unit and system tiers are separate entries so that once-per-day
      # selection keeps one of each rather than one of either.
      #
      # `allure-results/` at the archive root, deliberately not `*allure-...`:
      # the consumer artifact also holds a `baseline/allure-results/` copy.
      # Consumer artifacts are not collected at all - they are AP-Model-QC's
      # own tests run against a harness change, and are recorded under that
      # repository already.
      - name: "^mqc-reports-unit-none-replay-(?P<os>ubuntu[\\w.-]*)$"
        parser: allure_raw
        glob: "allure-results/*-result.json"
        steps: failures
        keep: latest_per_day
      - name: "^mqc-reports-system-none-replay-(?P<os>ubuntu[\\w.-]*)$"
        parser: allure_raw
        glob: "allure-results/*-result.json"
        steps: failures
        keep: latest_per_day

  - repo: apolskiy/AP-Model-QC
    prefix: MQC
    code: MQC-M
    test_id_from_name: "^(?P<test_id>MQC_[A-Z]+_[A-Z]+_\\d{6})(?:_|$)"
    artifacts:
      # Preconditions are the model repository's unit tests: they must pass
      # before any engine is measured, so once per day records that they held.
      - name: "^mqc-reports-cases-preconditions-(?P<os>ubuntu[\\w.-]*)$"
        parser: allure_raw
        glob: "allure-results/*-result.json"
        steps: failures
        keep: latest_per_day
      # The P0, P1 and P2-P4 bands of each engine's gate, every run. The band
      # is not captured: each test's band is fixed by the test itself. Early
      # runs carry no engine in the name, and the P2-P4 band was spelled `p2p4`
      # before `p2_p4`; both are accepted rather than lost.
      - name: "^mqc-reports-cases-(?:p0|p1|p2_p4|p2p4|none)-replay(?:-(?P<engine>claude|gemini|grok|openai))?-(?P<os>ubuntu[\\w.-]*)$"
        parser: allure_raw
        glob: "allure-results/*-result.json"
        steps: failures
      # The live evaluation ladder, dispatched by hand: preconditions, then
      # replay/replay (our code), replay/live (the judge) and live/live (the
      # model). Rare and small, and the only runs where a failure can belong to
      # the model rather than the code, so every run is kept with every step.
      - name: "^mqc-reports-cases-(?P<engine>claude|gemini|grok|openai)-(?P<rung>preconditions|replay-replay|replay-live|live-live)(?:-by-(?P<judge>\\w+))?$"
        parser: allure_raw
        glob: "allure-results/*-result.json"
